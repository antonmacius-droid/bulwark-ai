[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulwark-ai"
version = "0.1.0"
description = "Enterprise AI governance gateway — PII detection, budget control, audit logging, multi-tenant, RAG"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Bulwark AI" },
    { name = "AFKzona Group" },
]
keywords = ["ai", "governance", "llm", "pii", "audit", "security", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.20",
    "aiosqlite>=0.19",
    "httpx>=0.25",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=3.0"]
all = ["redis>=5.0", "fastapi>=0.100", "flask>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/bulwark-ai/bulwark-ai"
Documentation = "https://github.com/bulwark-ai/bulwark-ai#readme"
Repository = "https://github.com/bulwark-ai/bulwark-ai"

[tool.hatch.build.targets.wheel]
packages = ["bulwark_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.ruff]
target-version = "py39"
line-length = 120
